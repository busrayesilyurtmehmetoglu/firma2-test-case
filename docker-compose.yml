version: '3.8'
services:
  app:
    build: .
    container_name: ci_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: ci_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-net

  mysql:
    image: mysql:8.0
    container_name: ci_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  redis:
    image: redis:alpine
    container_name: ci_redis
    ports:
      - "6379:6379"
    networks:
      - app-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ci_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: app
      PMA_PASSWORD: app
    depends_on:
      - mysql
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge 